name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # Adoptium version_data.semver for release jdk-17.0.20.1+1.
          java-version: '17.0.20+101'
          cache: gradle
      - name: Prepare SDK
        shell: bash
        run: |
          # Ubuntu runners install command-line tools without adding them to PATH.
          sdkmanager="${ANDROID_HOME:?ANDROID_HOME must point to the runner SDK}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Validate workspace
        shell: pwsh
        run: ./scripts/check-workspace.ps1
      - name: Build, unit tests and lint
        run: bash ./gradlew checkKotlin assembleDebug testDebugUnitTest lintDebug --console=plain
      - name: Checksum APK
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Verify APK signature and permissions
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions app/build/outputs/apk/debug/app-debug.apk > app/build/apk-permissions.txt
          if rg 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' app/build/apk-permissions.txt; then
            exit 1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ritela-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-reports
          path: app/build/reports
          if-no-files-found: ignore
